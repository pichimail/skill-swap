name: Bootstrap Skill Swap source

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/skill-swap.tar.gz'

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Expand verified release source
        run: |
          tar -xzf .bootstrap/skill-swap.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit complete source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: publish Skill Swap with Neon and Upstash"
          git push origin HEAD:main
